name: prettify
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  prettier:
    name: Prettify (check only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check formatting
        run: npx prettier --check
